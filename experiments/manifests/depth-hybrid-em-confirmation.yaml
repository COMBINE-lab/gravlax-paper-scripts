    group_weight: 0.60
    sample_weight: 0.20
    group_prior: 80
  adaptive_component:
    cell_prior: 64
    group_prior: 80
  iterations: 10
  epsilon: 1.0e-9
  cell_shards: 64
  production_emission_unchanged: pooled
targets:
  type: keyed_mixed_class_mask
  mask_fraction: 0.20
  seeds: [7, 17, 29]
  candidate_gene_exclusion: union_across_all_seeds
  evaluation_population: supplied_group_barcodes_only
groups:
  expression_source: gravlax_v49_Gene_replay_before_EM
  called_cell_source: fresh_v49_STARsolo_filtered_barcodes_only
