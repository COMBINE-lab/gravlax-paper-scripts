  minimum_group_cells: 20
  minimum_median_pairwise_seed_ARI: 0.90
  selection: maximum_median_pairwise_seed_ARI
  tie_break: [lower_dimension, resolution_closest_to_0.50, lower_resolution]
  no_eligible_configuration: STOP
  shuffle: deterministic_size_preserving_label_permutation
factorial_arms:
  - hybrid_real
  - hybrid_shuffled
  - Dirichlet_proxy_real
  - Dirichlet_proxy_shuffled
  - fixed_convex_real_depth_guardrail
primary_hypotheses:
