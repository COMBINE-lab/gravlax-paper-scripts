state: executing

claim_taxonomy:
  serialization_identity:
    comparator: archive-sourced Gravlax vs BAM-sourced Gravlax after the same row reduction
    allowed_words: [byte-identical, exact]
  reduction_error:
    comparator: two-representative Gravlax vs full-read Gravlax on fixed alignments
    allowed_words: [deviation, incremental reduction error]
  fresh_pipeline_deviation:
    comparator: archive replay vs fresh annotation-aware STARsolo
    allowed_words: [deviation, fidelity]
    forbidden_words: [exact, byte-identical]

code_gates:
  - id: container-future-version
    requirement: seekable reader rejects versions newer than the implementation
  - id: container-directory-integrity
    requirement: directory extents, names, and inline headers are validated before allocation
  - id: entropy-stream-truncation
    requirement: missing rANS residual bits return an error rather than zero-fill
  - id: cli-golden
    requirement: generated multi-chunk tagged BAM to streaming AIE, eager AIE, and BAM replay is byte-identical
  - id: malformed-gtf
    requirement: zero, reversed, truncated, and invalid-strand exon records fail closed

